<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        // Suppress benign Vite HMR WebSocket connection closures in remote sandboxes
        const OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            const ws = protocols !== undefined ? new OriginalWebSocket(url, protocols) : new OriginalWebSocket(url);
            ws.addEventListener('error', function(e) {
              if (e && e.stopImmediatePropagation) e.stopImmediatePropagation();
            });
            return ws;
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = OriginalWebSocket.CONNECTING;
          window.WebSocket.OPEN = OriginalWebSocket.OPEN;
          window.WebSocket.CLOSING = OriginalWebSocket.CLOSING;
          window.WebSocket.CLOSED = OriginalWebSocket.CLOSED;
        }

        window.addEventListener('unhandledrejection', function(event) {
          var msg = event?.reason?.message || String(event?.reason || '');
          if (msg.includes('WebSocket')) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        });

        window.addEventListener('error', function(event) {
          var msg = event?.message || event?.error?.message || '';
          if (msg.includes('WebSocket')) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
